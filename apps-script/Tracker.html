<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>2027 IPP Portal</title>
  <style>
    :root {
      --purple: #4B286D;
      --dark:   #2B163F;
      --light:  #F4F4F7;
      --green:  #2B8000;
      --amber:  #B36B00;
      --red:    #C0392B;
      --ease:   cubic-bezier(0.16, 1, 0.3, 1);
      --vw: 100vw;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 0; background: transparent; }

    /* ---- Nav ---- */
    .nav {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(75,40,109,0.10);
    }
    .nav-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 68px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 800; color: var(--purple); letter-spacing: -0.01em;
      cursor: pointer; text-decoration: none;
    }
    .nav-brand span { font-weight: 300; color: rgba(43,22,63,0.55); }
    .nav-tabs { display: flex; gap: 2px; align-items: center; }
    .nav-tab {
      font-size: 14px; font-weight: 600; letter-spacing: .01em;
      color: var(--dark); opacity: .65;
      padding: 8px 14px; border: none; background: none; cursor: pointer;
      border-radius: 6px; transition: all .2s var(--ease); white-space: nowrap;
      position: relative;
    }
    .nav-tab:hover { opacity: 1; background: rgba(75,40,109,0.06); }
    .nav-tab.active { opacity: 1; color: var(--purple); font-weight: 700; }
    .nav-tab.active::after {
      content: ''; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px;
      background: var(--purple); border-radius: 2px;
    }
    .nav-refresh {
      font-size: 12px; font-weight: 600; color: rgba(43,22,63,0.45);
      padding: 6px 12px; border: 1px solid rgba(75,40,109,0.15); border-radius: 20px;
      background: none; cursor: pointer; transition: all .2s var(--ease);
    }
    .nav-refresh:hover { background: rgba(75,40,109,0.06); color: var(--purple); }

    /* ---- Pages ---- */
    .page { display: none; padding-top: 68px; animation: fadeUp .5s var(--ease); }
    .page.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 56px 0 48px; }
    .section + .section { border-top: 1px solid rgba(75,40,109,0.10); }

    /* ---- Typography ---- */
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--purple); margin-bottom: 10px;
    }
    .section-title {
      font-size: clamp(26px, 3vw, 40px); font-weight: 800; letter-spacing: -0.025em;
      color: var(--purple); margin-bottom: 8px; line-height: 1.1;
    }
    .section-lead {
      font-size: 16px; font-weight: 300; color: rgba(43,22,63,0.72); line-height: 1.6;
      max-width: 640px; margin-bottom: 32px;
    }
    h3.sub { font-size: 20px; font-weight: 700; color: var(--purple); margin-bottom: 16px; }

    /* ---- Hero ---- */
    .hero {
      padding: 80px 0 56px;
      background: linear-gradient(180deg, rgba(75,40,109,0.04) 0%, #fff 100%);
      border-bottom: 1px solid rgba(75,40,109,0.10);
    }
    .hero-title {
      font-size: clamp(38px, 5vw, 72px); font-weight: 900; letter-spacing: -0.03em;
      color: var(--purple); line-height: .95; margin-bottom: 20px;
    }
    .hero-lead {
      font-size: clamp(16px, 1.8vw, 20px); font-weight: 300; color: rgba(43,22,63,0.72);
      line-height: 1.6; max-width: 620px; margin-bottom: 36px;
    }
    .hero-stats { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 36px; }
    .hero-stat .n {
      font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: -0.03em;
      color: var(--purple); line-height: 1;
    }
    .hero-stat .l {
      font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(43,22,63,0.5); margin-top: 4px;
    }
    .hero-stat.warn .n { color: var(--amber); }
    .hero-stat.danger .n { color: var(--red); }

    /* ---- Progress track ---- */
    .progress-track {
      display: flex; align-items: flex-start; gap: 0;
      overflow-x: auto; padding: 24px 0; margin-bottom: 40px;
    }
    .pt-step { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 120px; position: relative; }
    .pt-step:not(:last-child)::after {
      content: ''; position: absolute; top: 19px; left: calc(50% + 20px);
      right: calc(-50% + 20px); height: 2px; background: rgba(75,40,109,0.15);
    }
    .pt-step.done:not(:last-child)::after { background: var(--green); }
    .pt-circle {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid rgba(75,40,109,0.2);
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: rgba(43,22,63,0.4);
      flex-shrink: 0; position: relative; z-index: 1;
      transition: all .3s var(--ease);
    }
    .pt-step.done .pt-circle { background: var(--green); border-color: var(--green); color: #fff; }
    .pt-step.active .pt-circle {
      background: var(--purple); border-color: var(--purple); color: #fff;
      box-shadow: 0 0 0 6px rgba(75,40,109,0.15);
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(75,40,109,0.15); }
      50% { box-shadow: 0 0 0 12px rgba(75,40,109,0.06); }
    }
    .pt-label {
      margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: .01em;
      color: rgba(43,22,63,0.55); text-align: center; line-height: 1.3; max-width: 100px;
    }
    .pt-step.done .pt-label, .pt-step.active .pt-label { color: var(--dark); }
    .pt-date { font-size: 10px; font-weight: 400; color: rgba(43,22,63,0.4); margin-top: 3px; }

    /* ---- Cards ---- */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      border: 1px solid rgba(75,40,109,0.14); background: #fff; border-radius: 16px;
      padding: 22px; transition: box-shadow .3s var(--ease), transform .3s var(--ease);
    }
    .card:hover { box-shadow: 0 16px 50px rgba(75,40,109,0.10); transform: translateY(-2px); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--dark); line-height: 1.35; flex: 1; }
    .card-meta { font-size: 12px; color: rgba(43,22,63,0.5); margin-top: 2px; }
    .card-owner { font-size: 12px; font-weight: 600; color: rgba(43,22,63,0.65); margin-top: 8px; }
    .card-notes { font-size: 13px; font-weight: 300; color: rgba(43,22,63,0.72); margin-top: 8px; line-height: 1.5; }
    .card-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(75,40,109,0.08); display: flex; align-items: center; justify-content: space-between; }
    .days-chip {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
      background: rgba(75,40,109,0.07); color: var(--purple);
    }
    .days-chip.overdue { background: rgba(192,57,43,0.10); color: var(--red); }
    .days-chip.soon { background: rgba(179,107,0,0.10); color: var(--amber); }
    .days-chip.done { background: rgba(43,128,0,0.10); color: var(--green); }

    /* ---- Status badges ---- */
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    }
    .badge-pending    { background: rgba(75,40,109,0.08);   color: var(--purple); }
    .badge-progress   { background: rgba(75,40,109,0.15);   color: var(--purple); }
    .badge-complete   { background: rgba(43,128,0,0.12);    color: var(--green); }
    .badge-overdue    { background: rgba(192,57,43,0.12);   color: var(--red); }
    .badge-at-risk    { background: rgba(179,107,0,0.12);   color: var(--amber); }
    .badge-cancelled  { background: rgba(43,22,63,0.08);    color: rgba(43,22,63,0.5); }

    /* RAID severity */
    .sev-high   { background: rgba(192,57,43,0.10);  color: var(--red); }
    .sev-medium { background: rgba(179,107,0,0.10);  color: var(--amber); }
    .sev-low    { background: rgba(43,128,0,0.10);   color: var(--green); }

    /* ---- Shaded band ---- */
    .shade-band { position: relative; padding: 40px 0; margin: 8px 0; }
    .shade-band::before {
      content: ''; position: absolute; top: 0; bottom: 0;
      left: calc(50% - var(--vw) / 2); width: var(--vw);
      background: var(--light); z-index: 0;
    }
    .shade-band > * { position: relative; z-index: 1; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; }
    table.data {
      width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px;
    }
    table.data th, table.data td {
      text-align: left; padding: 12px 16px;
      border-bottom: 1px solid rgba(75,40,109,0.10);
    }
    table.data thead th {
      background: rgba(75,40,109,0.04); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--purple);
      border-bottom: 2px solid rgba(75,40,109,0.18); white-space: nowrap;
    }
    table.data tbody tr:hover td { background: rgba(75,40,109,0.02); }
    table.data td.fade { color: rgba(43,22,63,0.45); font-size: 12px; }
    table.data td.overdue { color: var(--red); font-weight: 600; }

    /* ---- RAID collapsible ---- */
    .raid-type-head {
      display: flex; align-items: center; gap: 10px; padding: 14px 18px;
      background: rgba(75,40,109,0.04); border-radius: 10px; cursor: pointer;
      margin-bottom: 2px; border: 1px solid rgba(75,40,109,0.10);
      font-size: 13px; font-weight: 700; color: var(--purple);
      transition: background .2s var(--ease);
    }
    .raid-type-head:hover { background: rgba(75,40,109,0.08); }
    .raid-type-body { max-height: 0; overflow: hidden; transition: max-height .5s var(--ease); }
    .raid-type.open .raid-type-body { max-height: 2000px; }
    .chev { transition: transform .35s var(--ease); }
    .raid-type.open .chev { transform: rotate(180deg); }
    .raid-card {
      margin: 6px 0; padding: 16px 18px; border: 1px solid rgba(75,40,109,0.12);
      border-radius: 10px; background: #fff;
    }
    .raid-card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .raid-card-title { font-size: 14px; font-weight: 600; color: var(--dark); flex: 1; line-height: 1.4; }
    .raid-card-notes { font-size: 13px; font-weight: 300; color: rgba(43,22,63,0.65); line-height: 1.5; }
    .raid-card-footer { margin-top: 10px; font-size: 11px; color: rgba(43,22,63,0.5); display: flex; gap: 16px; }

    /* ---- Team grid ---- */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .team-card {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border: 1px solid rgba(75,40,109,0.12);
      border-radius: 12px; background: #fff;
      transition: box-shadow .2s var(--ease);
    }
    .team-card:hover { box-shadow: 0 8px 24px rgba(75,40,109,0.08); }
    .avatar-sm {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      background: var(--light); border: 1.5px solid rgba(75,40,109,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--purple);
    }
    .tc-name { font-size: 14px; font-weight: 700; color: var(--dark); line-height: 1.2; }
    .tc-role { font-size: 11px; color: rgba(43,22,63,0.55); margin-top: 2px; }
    .tc-email { font-size: 11px; color: var(--purple); margin-top: 3px; text-decoration: none; }
    .tc-email:hover { text-decoration: underline; }

    /* ---- Btn ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--purple); color: #fff; border: none;
      padding: 13px 28px; font-size: 13px; font-weight: 700; letter-spacing: .04em;
      border-radius: 999px; cursor: pointer;
      transition: background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
      box-shadow: 0 8px 24px rgba(75,40,109,0.22);
    }
    .btn:hover { background: var(--dark); transform: translateY(-1px); box-shadow: 0 12px 32px rgba(75,40,109,0.30); }
    .btn:disabled { opacity: .55; pointer-events: none; }
    .btn-ghost {
      background: transparent; color: var(--purple);
      border: 1.5px solid rgba(75,40,109,0.3); box-shadow: none;
    }
    .btn-ghost:hover { background: rgba(75,40,109,0.06); transform: none; box-shadow: none; }
    .btn-sm { padding: 8px 18px; font-size: 12px; }
    .spin { display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Toast ---- */
    #toastContainer { position: fixed; bottom: 28px; right: 28px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      padding: 14px 20px; background: var(--dark); color: #fff;
      border-radius: 10px; font-size: 14px; font-weight: 500;
      box-shadow: 0 12px 36px rgba(0,0,0,0.22); max-width: 340px;
      animation: toastIn .4s var(--ease);
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--red); }
    .toast.info    { border-left: 3px solid var(--purple); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* ---- Admin panel ---- */
    .admin-bar {
      margin-top: 24px; padding: 16px 20px;
      background: rgba(75,40,109,0.04); border: 1px solid rgba(75,40,109,0.12);
      border-radius: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .admin-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(43,22,63,0.45); }

    /* ---- Empty states ---- */
    .empty {
      padding: 40px; text-align: center; color: rgba(43,22,63,0.45);
      font-size: 14px; border: 1px dashed rgba(75,40,109,0.2); border-radius: 12px;
    }

    /* ---- Footer ---- */
    footer {
      background: var(--purple); color: #fff; margin-top: 64px;
      padding: 28px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .foot-left { font-size: 12px; font-weight: 600; letter-spacing: .04em; opacity: .7; }
    .foot-right { font-size: 11px; opacity: .5; }

    /* ---- Calendar ---- */
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .cal-month-label {
      font-size: 22px; font-weight: 800; color: var(--purple); letter-spacing: -0.02em;
    }
    .cal-nav-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(75,40,109,0.2);
      background: #fff; color: var(--purple); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s var(--ease);
    }
    .cal-nav-btn:hover { background: rgba(75,40,109,0.08); border-color: rgba(75,40,109,0.4); }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border: 1px solid rgba(75,40,109,0.12); border-radius: 14px; overflow: hidden;
    }
    .cal-dow {
      padding: 10px 6px; text-align: center;
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(43,22,63,0.45); background: rgba(75,40,109,0.03);
      border-bottom: 1px solid rgba(75,40,109,0.10);
    }
    .cal-cell {
      min-height: 100px; padding: 8px;
      border-right: 1px solid rgba(75,40,109,0.08);
      border-bottom: 1px solid rgba(75,40,109,0.08);
      vertical-align: top; background: #fff;
      transition: background .15s var(--ease);
    }
    .cal-cell:hover { background: rgba(75,40,109,0.02); }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.other-month { background: #fafafa; }
    .cal-cell.today { background: rgba(75,40,109,0.04); }
    .cal-day-num {
      font-size: 13px; font-weight: 600; color: rgba(43,22,63,0.4);
      margin-bottom: 6px; line-height: 1;
    }
    .cal-cell.today .cal-day-num {
      width: 24px; height: 24px; border-radius: 50%; background: var(--purple);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .cal-cell.other-month .cal-day-num { color: rgba(43,22,63,0.2); }
    .cal-event {
      display: block; font-size: 11px; font-weight: 600; line-height: 1.3;
      padding: 2px 6px; border-radius: 4px; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: default;
    }
    .cal-event.milestone { background: rgba(75,40,109,0.12); color: var(--purple); }
    .cal-event.milestone.complete { background: rgba(43,128,0,0.12); color: var(--green); }
    .cal-event.milestone.overdue  { background: rgba(192,57,43,0.12); color: var(--red); }
    .cal-event.milestone.at-risk  { background: rgba(179,107,0,0.12); color: var(--amber); }
    .cal-event.workback { background: rgba(43,22,63,0.07); color: rgba(43,22,63,0.65); }
    .cal-event.more { background: none; color: rgba(43,22,63,0.4); font-size: 10px; padding: 0 4px; }
    .cal-legend {
      display: flex; gap: 18px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
    }
    .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(43,22,63,0.6); }
    .cal-legend-dot { width: 10px; height: 10px; border-radius: 2px; }

    @media (max-width: 768px) {
      .nav-tabs { display: none; }
      .hero-stats { gap: 20px; }
      .progress-track { gap: 0; }
      .cal-cell { min-height: 60px; padding: 4px; }
      .cal-event { font-size: 9px; }
    }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(43,22,63,0.45);
      backdrop-filter: blur(4px); z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 20px; padding: 36px; width: 100%;
      max-width: 480px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(43,22,63,0.22);
      animation: modalIn .3s var(--ease);
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .modal-title { font-size: 20px; font-weight: 800; color: var(--purple); letter-spacing: -0.02em; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(43,22,63,0.55); margin-bottom: 6px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 14px; border: 1px solid rgba(75,40,109,0.2);
      border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px;
      color: var(--dark); background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(75,40,109,0.10);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand" onclick="go('overview')">
      2027 IPP Portal <span>Incentive Planning</span>
    </div>
    <div class="nav-tabs" id="navTabs"></div>
    <button class="nav-refresh" id="refreshBtn" onclick="refresh()">↻ Refresh</button>
  </div>
</nav>

<main id="app"></main>
<div id="toastContainer"></div>

<!-- Modal overlay -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalForm"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" id="modalSubmit" onclick="submitModal()">Save</button>
    </div>
  </div>
</div>

<footer>
  <div class="foot-left">2027 IPP Portal — Enterprise & Public Business</div>
  <div class="foot-right" id="lastUpdated"></div>
</footer>

<script>
  // Data injected server-side
  var DATA = <?!= JSON.stringify(data) ?>;

  var TABS = [
    { id: 'overview', label: 'Overview' },
    { id: 'calendar', label: 'Calendar' },
    { id: 'workback', label: 'Workback Plan' },
    { id: 'raid',     label: 'RAID Log' },
    { id: 'team',     label: 'Program Team' },
  ];

  // ---- Renderers ----

  function renderOverview() {
    var s = DATA.summary || {};
    var isAdmin = DATA.isAdmin;

    var pct = s.pctComplete || 0;
    var heroStats =
      hstat(pct + '%', 'Tasks Complete') +
      hstat(s.workbackTotal || 0, 'Total Tasks') +
      hstats(s.workbackOverdue || 0, 'Overdue', s.workbackOverdue > 0 ? 'danger' : '') +
      hstat(s.openRaidItems || 0, 'Open RAID Items');

    var keyMilestones = [
      { name: 'Data Analysis Ready',   date: 'Aug 13, 2026', iso: '2026-08-13' },
      { name: 'VP Leadership Review',  date: 'Aug 20, 2026', iso: '2026-08-20' },
      { name: 'Final Decision',        date: 'Aug 27, 2026', iso: '2026-08-27' },
      { name: 'Incentives Team Ready', date: 'Sep 2026',     iso: '2026-09-01' },
      { name: 'Implementation',        date: 'Mid-Dec 2026', iso: '2026-12-15' },
    ];

    var now = new Date(); now.setHours(0, 0, 0, 0);
    var track = keyMilestones.map(function(km, idx) {
      var d = new Date(km.iso);
      var isPast = d <= now;
      var isNext = !isPast && (idx === 0 || new Date(keyMilestones[idx - 1].iso) <= now);
      var cls = isPast ? 'done' : (isNext ? 'active' : '');
      var icon = isPast ? '✓' : (isNext ? '●' : String(idx + 1));
      return '<div class="pt-step ' + cls + '">' +
        '<div class="pt-circle">' + esc(icon) + '</div>' +
        '<div class="pt-label">' + esc(km.name) + '</div>' +
        '<div class="pt-date">' + esc(km.date) + '</div>' +
        '</div>';
    }).join('');

    var adminPanel = isAdmin
      ? '<div class="admin-bar"><div class="admin-label">Admin</div>' +
        '<button class="btn btn-ghost btn-sm" id="chatBtn" onclick="sendAlert()">📣 Send Chat Alert</button>' +
        '</div>'
      : '';

    return '<div id="overview" class="page">' +
      '<div class="wrap">' +
        '<div class="hero">' +
          '<div class="eyebrow">2027 Incentive Planning Process</div>' +
          '<h1 class="hero-title">IPP Portal</h1>' +
          '<p class="hero-lead">Real-time tracking for the 2027 incentive planning workflow. Monitor milestone progress, workback tasks, RAID items, and team assignments in one place.</p>' +
          '<div class="hero-stats">' + heroStats + '</div>' +
          adminPanel +
        '</div>' +
        '<div class="section">' +
          '<div class="eyebrow">Program Milestones</div>' +
          '<h2 class="section-title">Key Milestones</h2>' +
          '<div class="progress-track">' + track + '</div>' +
        '</div>' +
      '</div></div>';
  }

  // ---- Calendar state ----
  var _today = new Date();
  var _calYear  = _today.getFullYear();
  var _calMonth = _today.getMonth(); // 0-based

  var MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function renderCalendar() {
    return '<div id="calendar" class="page">' +
      '<div class="wrap">' +
        '<div class="section">' +
          '<div class="eyebrow">Program Schedule</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
            '<h2 class="section-title" style="margin-bottom:0">Calendar</h2>' +
            '<button class="btn btn-sm" onclick="openModal(\'calendar\')">&#xff0b; Add Item</button>' +
          '</div>' +
          '<p class="section-lead">Workback tasks plotted by due date. Navigate months with the arrows.</p>' +
          '<div class="cal-legend">' +
            '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(43,128,0,0.25)"></div> Complete</div>' +
            '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(192,57,43,0.2)"></div> Overdue</div>' +
            '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(179,107,0,0.2)"></div> At Risk</div>' +
            '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(43,22,63,0.12)"></div> Workback task</div>' +
          '</div>' +
          '<div id="calWrap">' + calGrid() + '</div>' +
        '</div>' +
      '</div></div>';
  }

  function calGrid() {
    var year = _calYear, month = _calMonth;
    var firstDay = new Date(year, month, 1).getDay(); // 0=Sun
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daysInPrev  = new Date(year, month, 0).getDate();
    var todayStr = isoDate(_today);

    // Build event index keyed by YYYY-MM-DD
    var evIndex = {};
    function addEv(isoStr, ev) {
      if (!isoStr) return;
      var key = isoStr.slice(0, 10);
      evIndex[key] = evIndex[key] || [];
      evIndex[key].push(ev);
    }
    (DATA.workback || []).forEach(function(w) {
      var iso = w.dueDateISO || isoFromFormatted(w.dueDate);
      addEv(iso, { label: w.task, type: 'workback', status: w.status });
    });

    var header =
      '<div class="cal-header">' +
        '<button class="cal-nav-btn" onclick="navCal(-1)">&#8249;</button>' +
        '<div class="cal-month-label">' + MONTH_NAMES[month] + ' ' + year + '</div>' +
        '<button class="cal-nav-btn" onclick="navCal(1)">&#8250;</button>' +
      '</div>';

    var dowRow = DOW.map(function(d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

    var cells = '';
    var totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

    for (var i = 0; i < totalCells; i++) {
      var dayNum, cellDate, isOther = false;
      if (i < firstDay) {
        dayNum = daysInPrev - firstDay + i + 1;
        cellDate = new Date(year, month - 1, dayNum);
        isOther = true;
      } else if (i >= firstDay + daysInMonth) {
        dayNum = i - firstDay - daysInMonth + 1;
        cellDate = new Date(year, month + 1, dayNum);
        isOther = true;
      } else {
        dayNum = i - firstDay + 1;
        cellDate = new Date(year, month, dayNum);
      }

      var cellISO = isoDate(cellDate);
      var isToday = cellISO === todayStr;
      var cls = 'cal-cell' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '');

      var dayNumHtml = isToday
        ? '<div class="cal-day-num" style="display:flex">' + dayNum + '</div>'
        : '<div class="cal-day-num">' + dayNum + '</div>';

      var evs = evIndex[cellISO] || [];
      var MAX_SHOW = 3;
      var evHtml = evs.slice(0, MAX_SHOW).map(function(ev) {
        var stCls = ev.status === 'COMPLETE' ? ' complete' : ev.status === 'OVERDUE' ? ' overdue' : ev.status === 'AT RISK' ? ' at-risk' : '';
        return '<span class="cal-event milestone' + stCls + '" title="' + esc(ev.label) + '">' + esc(ev.label) + '</span>';
      }).join('');
      if (evs.length > MAX_SHOW) {
        evHtml += '<span class="cal-event more">+' + (evs.length - MAX_SHOW) + ' more</span>';
      }

      cells += '<div class="' + cls + '">' + dayNumHtml + evHtml + '</div>';
    }

    return header + '<div class="cal-grid">' + dowRow + cells + '</div>';
  }

  function navCal(delta) {
    _calMonth += delta;
    if (_calMonth > 11) { _calMonth = 0; _calYear++; }
    if (_calMonth < 0)  { _calMonth = 11; _calYear--; }
    document.getElementById('calWrap').innerHTML = calGrid();
  }

  function isoDate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function isoFromFormatted(str) {
    if (!str) return '';
    var d = new Date(str);
    return isNaN(d.getTime()) ? '' : isoDate(d);
  }

  function renderWorkback() {
    var rows = DATA.workback || [];
    var streams = {};
    rows.forEach(function(r) { var s = r.workstream || 'General'; streams[s] = streams[s] || []; streams[s].push(r); });

    var body = rows.length ? rows.map(function(r) {
      var dc = r.daysLeft !== null && r.daysLeft < 0 && r.status !== 'COMPLETE' ? 'overdue' : '';
      return '<tr>' +
        '<td>' + esc(r.task) + '</td>' +
        '<td class="fade">' + esc(r.workstream) + '</td>' +
        '<td class="fade">' + esc(r.owner) + '</td>' +
        '<td>' + esc(r.dueDate || r.startDate) + '</td>' +
        '<td class="' + dc + '">' + (r.daysLeft !== null ? (r.daysLeft < 0 ? Math.abs(r.daysLeft) + 'd late' : r.daysLeft + 'd') : '—') + '</td>' +
        '<td><span class="badge ' + badgeCls(r.status) + '">' + esc(r.status) + '</span></td>' +
        (r.notes ? '<td class="fade">' + esc(r.notes.slice(0, 80)) + (r.notes.length > 80 ? '…' : '') + '</td>' : '<td></td>') +
      '</tr>';
    }).join('') : '<tr><td colspan="7"><div class="empty">No workback items loaded.</div></td></tr>';

    return '<div id="workback" class="page">' +
      '<div class="wrap">' +
        '<div class="section">' +
          '<div class="eyebrow">Planning Schedule</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
            '<h2 class="section-title" style="margin-bottom:0">Workback Plan — 2027</h2>' +
            '<button class="btn btn-sm" onclick="openModal(\'milestone\')">&#xff0b; Add Milestone</button>' +
          '</div>' +
          '<p class="section-lead">Task-level schedule pulled from the 2027 workback sheet. Rows highlighted in red are past due.</p>' +
          '<div class="table-wrap"><table class="data">' +
            '<thead><tr><th>Task</th><th>Workstream</th><th>Owner</th><th>Due Date</th><th>Days</th><th>Status</th><th>Notes</th></tr></thead>' +
            '<tbody>' + body + '</tbody>' +
          '</table></div>' +
        '</div>' +
      '</div></div>';
  }

  function renderRaid() {
    var items = DATA.raid || [];
    var types = {};
    items.forEach(function(r) {
      var t = (r.type || 'Risk').trim();
      types[t] = types[t] || [];
      types[t].push(r);
    });

    var sections = Object.keys(types).length ? Object.keys(types).map(function(type) {
      var list = types[type];
      var open = list.filter(function(r) { return r.status !== 'CLOSED' && r.status !== 'COMPLETE'; }).length;
      var cards = list.map(function(r) {
        var sevCls = sevClass(r.severity);
        return '<div class="raid-card">' +
          '<div class="raid-card-head">' +
            '<div class="raid-card-title">' + esc(r.title) + '</div>' +
            (r.severity ? '<span class="badge ' + sevCls + '">' + esc(r.severity) + '</span>' : '') +
            '<span class="badge ' + badgeCls(r.status) + '">' + esc(r.status) + '</span>' +
          '</div>' +
          (r.notes ? '<div class="raid-card-notes">' + esc(r.notes) + '</div>' : '') +
          '<div class="raid-card-footer">' +
            (r.owner ? '<span>👤 ' + esc(r.owner) + '</span>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      return '<div class="raid-type">' +
        '<div class="raid-type-head" onclick="toggleRaidType(this)">' +
          '<span>' + esc(type) + '</span>' +
          '<span class="badge badge-pending">' + open + ' open</span>' +
          '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="raid-type-body"><div style="padding:6px 0">' + cards + '</div></div>' +
      '</div>';
    }).join('') : '<div class="empty">No RAID items loaded. Check the RAID_Log tab.</div>';

    return '<div id="raid" class="page">' +
      '<div class="wrap">' +
        '<div class="section">' +
          '<div class="eyebrow">Risk Management</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
            '<h2 class="section-title" style="margin-bottom:0">RAID Log</h2>' +
            '<button class="btn btn-sm" onclick="openModal(\'raid\')">&#xff0b; Add RAID Item</button>' +
          '</div>' +
          '<p class="section-lead">Risks, Assumptions, Issues, and Dependencies tracked for the 2027 IPP program. Click a category to expand.</p>' +
          sections +
        '</div>' +
      '</div></div>';
  }

  function renderTeam() {
    var members = DATA.team || [];
    var cards = members.length ? members.map(function(m) {
      var initials = m.name.split(' ').map(function(w) { return w[0] || ''; }).slice(0, 2).join('').toUpperCase();
      return '<div class="team-card">' +
        '<div class="avatar-sm">' + esc(initials) + '</div>' +
        '<div>' +
          '<div class="tc-name">' + esc(m.name) + '</div>' +
          (m.role ? '<div class="tc-role">' + esc(m.role) + '</div>' : '') +
          (m.email ? '<a class="tc-email" href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a>' : '') +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty">No team members loaded. Check the Program_Team tab.</div>';

    return '<div id="team" class="page">' +
      '<div class="wrap">' +
        '<div class="section">' +
          '<div class="eyebrow">Program Team</div>' +
          '<h2 class="section-title">Team Directory</h2>' +
          '<p class="section-lead">Members of the 2027 IPP core working team and their roles.</p>' +
          '<div class="team-grid">' + cards + '</div>' +
        '</div>' +
      '</div></div>';
  }

  // ---- Nav & routing ----
  function buildNav() {
    var wrap = document.getElementById('navTabs');
    wrap.innerHTML = TABS.map(function(t) {
      return '<button class="nav-tab" data-id="' + t.id + '" onclick="go(\'' + t.id + '\')">' + t.label + '</button>';
    }).join('');
  }

  function go(id) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-id') === id);
    });
    window.scrollTo({ top: 0, behavior: 'auto' });
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  }

  // ---- RAID accordion ----
  function toggleRaidType(head) {
    var section = head.parentElement;
    section.classList.toggle('open');
  }

  // ---- Refresh ----
  function refresh() {
    var btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">↻</span> Refreshing…';
    google.script.run
      .withSuccessHandler(function(fresh) {
        DATA = fresh;
        renderAll();
        go(currentPage());
        btn.disabled = false;
        btn.innerHTML = '↻ Refresh';
        toast('Dashboard refreshed', 'success');
        updateLastUpdated();
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = '↻ Refresh';
        toast('Refresh failed: ' + err, 'error');
      })
      .getPortalData();
  }

  // Auto-refresh disabled — use the ↻ Refresh button to reload data manually.

  // ---- Admin: send Google Chat alert ----
  function sendAlert() {
    var btn = document.getElementById('chatBtn');
    if (!btn) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">●</span> Sending…';
    var s = DATA.summary || {};
    var msg = '📊 *2027 IPP Portal — Status Update*\n\n' +
      '• Tasks complete: ' + (s.pctComplete || 0) + '% (' + (s.workbackComplete || 0) + '/' + (s.workbackTotal || 0) + ')\n' +
      '• Overdue items: ' + (s.workbackOverdue || 0) + '\n' +
      '• Open RAID items: ' + (s.openRaidItems || 0);
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerHTML = '📣 Send Chat Alert';
        if (result && result.success) {
          toast('Google Chat alert sent ✓', 'success');
        } else {
          toast('Chat send failed: ' + (result && result.error || 'unknown'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = '📣 Send Chat Alert';
        toast('Chat send failed: ' + err, 'error');
      })
      .sendChatNotification(msg);
  }

  // ---- Helpers ----
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function badgeCls(status) {
    var s = String(status || '').toUpperCase();
    if (s === 'COMPLETE')    return 'badge-complete';
    if (s === 'IN PROGRESS') return 'badge-progress';
    if (s === 'OVERDUE')     return 'badge-overdue';
    if (s === 'AT RISK')     return 'badge-at-risk';
    if (s === 'CANCELLED')   return 'badge-cancelled';
    return 'badge-pending';
  }

  function sevClass(sev) {
    var s = String(sev || '').toUpperCase();
    if (/HIGH|CRIT/.test(s)) return 'badge sev-high';
    if (/MED/.test(s))       return 'badge sev-medium';
    return 'badge sev-low';
  }

  function daysChip(days, status) {
    if (days === null || days === undefined) return '';
    if (status === 'COMPLETE') return '<span class="days-chip done">Done</span>';
    if (days < 0)  return '<span class="days-chip overdue">' + Math.abs(days) + 'd overdue</span>';
    if (days <= 7) return '<span class="days-chip soon">' + days + 'd left</span>';
    return '<span class="days-chip">' + days + 'd</span>';
  }

  function hstat(n, l) { return '<div class="hero-stat"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>'; }
  function hstats(n, l, cls) { return '<div class="hero-stat ' + cls + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>'; }

  function toast(msg, type) {
    var c = document.getElementById('toastContainer');
    var d = document.createElement('div');
    d.className = 'toast ' + (type || 'info');
    d.textContent = msg;
    c.appendChild(d);
    setTimeout(function() { d.remove(); }, 3500);
  }

  function currentPage() {
    var tab = document.querySelector('.nav-tab.active');
    return tab ? tab.getAttribute('data-id') : 'overview';
  }

  function updateLastUpdated() {
    var el = document.getElementById('lastUpdated');
    if (DATA.lastUpdated) {
      var d = new Date(DATA.lastUpdated);
      el.textContent = 'Last updated: ' + d.toLocaleTimeString();
    }
  }

  function renderAll() {
    var app = document.getElementById('app');
    app.innerHTML = renderOverview() + renderCalendar() + renderWorkback() + renderRaid() + renderTeam();
  }

  // ---- Modal ----
  var _modalType = '';

  function openModal(type) {
    _modalType = type;
    var title = document.getElementById('modalTitle');
    var form  = document.getElementById('modalForm');

    if (type === 'raid') {
      title.textContent = 'Add RAID Item';
      form.innerHTML =
        fg('Description', '<textarea class="form-textarea" id="f_description" required placeholder="Describe the risk, action, issue or decision…"></textarea>') +
        fg('RAID Category', '<select class="form-select" id="f_raidCategory"><option>Action</option><option>Risk</option><option>Issue</option><option>Decision</option></select>') +
        fg('Priority', '<select class="form-select" id="f_priority"><option>High</option><option>Critical</option><option>Moderate</option><option>Low</option></select>') +
        fg('Owner', '<input class="form-input" id="f_owner" type="text" placeholder="Name or team">') +
        fg('Impacted Team', '<input class="form-input" id="f_impactedTeam" type="text" placeholder="Which team is affected?">') +
        fg('Next Step', '<input class="form-input" id="f_nextStep" type="text" placeholder="Immediate action required">');
    } else {
      title.textContent = type === 'milestone' ? 'Add Milestone' : 'Add Calendar Item';
      form.innerHTML =
        fg('Milestone / Task', '<input class="form-input" id="f_milestone" type="text" required placeholder="Name this milestone or task">') +
        fg('Responsible', '<input class="form-input" id="f_responsible" type="text" placeholder="Primary responsible party">') +
        fg('Owner(s)', '<input class="form-input" id="f_owners" type="text" placeholder="Additional owners">') +
        fg('Start Date', '<input class="form-input" id="f_start" type="date">') +
        fg('End Date', '<input class="form-input" id="f_end" type="date" required>') +
        fg('Status', '<select class="form-select" id="f_status"><option>PENDING</option><option>IN PROGRESS</option><option>COMPLETE</option><option>AT RISK</option></select>') +
        fg('Comments', '<input class="form-input" id="f_comments" type="text" placeholder="Optional notes">');
    }

    document.getElementById('modalSubmit').disabled = false;
    document.getElementById('modalSubmit').textContent = 'Save';
    document.getElementById('modalOverlay').classList.add('open');
    var first = form.querySelector('input, textarea, select');
    if (first) setTimeout(function() { first.focus(); }, 80);
  }

  function fg(label, control) {
    return '<div class="form-group"><label class="form-label">' + label + '</label>' + control + '</div>';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    _modalType = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function submitModal() {
    var btn = document.getElementById('modalSubmit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#9679;</span> Saving…';

    function onFail(err) {
      btn.disabled = false;
      btn.textContent = 'Save';
      toast('Save failed: ' + err, 'error');
    }

    if (_modalType === 'raid') {
      var desc = document.getElementById('f_description').value.trim();
      if (!desc) { btn.disabled = false; btn.textContent = 'Save'; toast('Description is required', 'error'); return; }
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.textContent = 'Save';
          if (result && result.success) { closeModal(); toast('RAID item added ✓', 'success'); refresh(); }
          else toast('Save failed: ' + (result && result.error || 'unknown'), 'error');
        })
        .withFailureHandler(onFail)
        .addRaidItem({
          description:  desc,
          raidCategory: document.getElementById('f_raidCategory').value,
          priority:     document.getElementById('f_priority').value,
          owner:        document.getElementById('f_owner').value.trim(),
          impactedTeam: document.getElementById('f_impactedTeam').value.trim(),
          nextStep:     document.getElementById('f_nextStep').value.trim(),
        });
    } else {
      var name = document.getElementById('f_milestone').value.trim();
      var end  = document.getElementById('f_end').value;
      if (!name) { btn.disabled = false; btn.textContent = 'Save'; toast('Milestone name is required', 'error'); return; }
      if (!end)  { btn.disabled = false; btn.textContent = 'Save'; toast('End date is required', 'error'); return; }
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.textContent = 'Save';
          if (result && result.success) { closeModal(); toast('Milestone added ✓', 'success'); refresh(); }
          else toast('Save failed: ' + (result && result.error || 'unknown'), 'error');
        })
        .withFailureHandler(onFail)
        .addMilestone({
          milestone:   name,
          responsible: document.getElementById('f_responsible').value.trim(),
          owners:      document.getElementById('f_owners').value.trim(),
          start:       document.getElementById('f_start').value,
          end:         end,
          status:      document.getElementById('f_status').value,
          comments:    document.getElementById('f_comments').value.trim(),
        });
    }
  }

  // ---- Init ----
  function init() {
    renderAll();
    buildNav();
    updateLastUpdated();
    var start = (location.hash || '#overview').slice(1);
    if (!TABS.some(function(t) { return t.id === start; })) start = 'overview';
    go(start);

    // Set --vw for full-bleed elements
    function setVW() {
      document.documentElement.style.setProperty('--vw', document.documentElement.clientWidth + 'px');
    }
    setVW();
    window.addEventListener('resize', setVW);
  }

  init();
</script>
</body>
</html>
